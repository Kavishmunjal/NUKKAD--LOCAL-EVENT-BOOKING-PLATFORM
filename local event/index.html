<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nukkad - Local Event Booking</title>

  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <header class="header">
    <div class="container header-inner">
      <h1 class="logo">Nukkad</h1>
      <nav>
        <button class="nav-btn active" data-section="events-section">Events</button>
        <button class="nav-btn" data-section="host-section">Host an event</button>
        <button class="nav-btn" data-section="tickets-section">My tickets <span id="ticket-count"></span></button>
      </nav>
    </div>
  </header>

  <main class="container">

    
    <section id="events-section">
      <div class="hero">
        <h2>Small events, right around the corner</h2>
        <p>Workshops, open mics, tournaments and meetups hosted by people in your area.</p>
        <input type="text" id="search-box" placeholder="Search by name, venue or topic">
        <div id="category-buttons"></div>
      </div>

      <div id="events-list" class="cards"></div>
    </section>

    <!-- Host an event-->
    <section id="host-section" class="hidden">
      <form id="host-form" class="form-box">
        <h2>Host an event</h2>

        <label for="host-title">Event name</label>
        <input type="text" id="host-title" maxlength="60">

        <div class="two-columns">
          <div>
            <label for="host-category">Category</label>
            <select id="host-category">
              <option>Music</option>
              <option>Workshop</option>
              <option>Sports</option>
              <option>Food</option>
              <option>Art</option>
              <option>Tech</option>
            </select>
          </div>
          <div>
            <label for="host-venue">Venue</label>
            <input type="text" id="host-venue" maxlength="60">
          </div>
        </div>

        <div class="two-columns">
          <div>
            <label for="host-date">Date</label>
            <input type="date" id="host-date">
          </div>
          <div>
            <label for="host-time">Start time</label>
            <input type="time" id="host-time">
          </div>
        </div>

        <div class="two-columns">
          <div>
            <label for="host-price">Ticket price in ₹ </label>
            <input type="number" id="host-price" value="100" min="0">
          </div>
          <div>
            <label for="host-seats">Total seats</label>
            <input type="number" id="host-seats" value="30" min="1">
          </div>
        </div>

        <label for="host-desc">Description</label>
        <textarea id="host-desc" rows="3" maxlength="240"></textarea>

        <p class="error" id="host-error"></p>
        <button type="submit" class="btn">Publish event</button>
      </form>
    </section>

    <!-- ===== Section 3: My tickets ===== -->
    <section id="tickets-section" class="hidden">
      <div class="hero">
        <h2>My tickets</h2>
        <p>Show the booking code at the entrance.</p>
      </div>
      <div id="tickets-list" class="cards"></div>
    </section>

  </main>

  <!-- ===== Booking popup ===== -->
  <dialog id="booking-dialog">
    <form id="booking-form">
      <h2 id="book-title"></h2>
      <p id="book-info" class="small-text"></p>

      <label for="book-name">Your name</label>
      <input type="text" id="book-name" maxlength="40">

      <label for="book-phone">Mobile number</label>
      <input type="text" id="book-phone" maxlength="10">

      <div class="two-columns">
        <div>
          <label for="book-qty">Tickets</label>
          <input type="number" id="book-qty" value="1" min="1">
        </div>
        <div>
          <label for="book-payment">Pay with</label>
          <select id="book-payment">
            <option>UPI</option>
            <option>Card</option>
            <option>Cash at venue</option>
          </select>
        </div>
      </div>

      <div class="total-row">
        <span>Total</span>
        <span id="book-total"></span>
      </div>

      <p class="error" id="book-error"></p>

      <div class="button-row">
        <button type="button" class="btn-light" id="cancel-book-btn">Cancel</button>
        <button type="submit" class="btn">Confirm booking</button>
      </div>
      <p class="small-text">Demo project: no real payment is taken.</p>
    </form>
  </dialog>

  <!-- ===== Booking success popup ===== -->
  <dialog id="success-dialog">
    <h2>You're booked!</h2>
    <p id="success-text"></p>
    <div class="booking-code" id="success-code"></div>
    <div class="button-row">
      <button class="btn" id="close-success-btn">Done</button>
    </div>
  </dialog>

  <!-- Small message that appears at the bottom -->
  <div id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
